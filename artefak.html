<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Artefak Pembelajaran</title>

  <link rel="stylesheet" href="style.css">
  <script defer src="artefak.js"></script>
</head>

<body class="artifact-page">

  <!-- HEADER -->
  <header class="artifact-page-header">
    <div class="wrap artifact-nav">

      <a href="index.html" class="artifact-back">
        ← Kembali ke Portofolio
      </a>

      <div class="artifact-brand">
        <strong>ARTEFAK PEMBELAJARAN</strong>
        <small>Portofolio Guru Berdampak · SDG 4</small>
      </div>

    </div>
  </header>


  <main>

    <!-- HERO -->
    <section class="artifact-hero">
      <div class="wrap">

        <p class="eyebrow">
          PORTOFOLIO AKSI SDGs
        </p>

        <h1 id="artifactTitle">
          Artefak Pembelajaran
        </h1>

        <p
          class="artifact-subtitle"
          id="artifactSubtitle">
        </p>

      </div>
    </section>


    <!-- KONTEN -->
    <section class="artifact-content">
      <div class="wrap">

        <!-- PENJELASAN KEGIATAN -->
        <div class="artifact-description">

          <p class="artifact-section-label">
            TENTANG KEGIATAN
          </p>

          <p id="artifactDescription">
          </p>

        </div>


        <!-- TAB DOKUMEN -->
        <div class="artifact-tabs" role="tablist">

          <button
            class="artifact-tab active"
            type="button"
            data-file="modul">
            Modul Ajar
          </button>

          <button
            class="artifact-tab"
            type="button"
            data-file="lkpd">
            LKPD
          </button>

          <button
            class="artifact-tab"
            type="button"
            data-file="media">
            Media
          </button>

        </div>


        <!-- INFO FILE -->
        <div class="artifact-file-info">

          <div class="artifact-file-main">

            <span class="artifact-file-type">
              PDF
            </span>

            <div>
              <strong id="artifactFileTitle">
                Dokumen Artefak
              </strong>

              <small id="artifactFileDescription">
              Pilih dokumen untuk ditampilkan.
              </small>
            </div>

          </div>


          <a
            id="artifactOpenNewTab"
            href="#"
            target="_blank"
            rel="noopener">
            Buka PDF ↗
          </a>

        </div>


        <!-- PDF VIEWER -->
        <div class="artifact-viewer">

          <iframe
            id="artifactFrame"
            title="Dokumen Artefak">
          </iframe>

        </div>


        <!-- REFLEKSI -->
        <div class="artifact-reflection">

          <article>
            <span>REFLEKSI</span>

            <p id="artifactReflection">
            </p>
          </article>


          <article>
            <span>TINDAK LANJUT</span>

            <p id="artifactFollowUp">
            </p>
          </article>

        </div>

      </div>
    </section>

  </main>


  <!-- FOOTER -->
  <footer class="artifact-footer">
    <div class="wrap">
      <p>
        Portofolio Guru Berdampak · SDG 4 — Pendidikan Berkualitas
      </p>
    </div>
  </footer>

</body>
</html>
